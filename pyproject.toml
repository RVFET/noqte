[project]
name = "noqte"
version = "0.1.0"
description = "Fast, modular, cross-platform dotfiles and package manager"
readme = "readme.md"
authors = [
    { name = "RVFET", email = "me@rvfet.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pyrage>=1.2.0",
    "pyyaml>=6.0.2",
    "rich>=13.7.1",
    "typer>=0.12.0",
    "wcmatch>=8.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[project.scripts]
noqte = "noqte.cli:app"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv_build]
packages = ["src/noqte"]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]