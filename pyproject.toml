[project]
name = "noqte"
version = "0.2.0"
description = "Fast, modular and ergonomic cross-platform dotfiles manager."
readme = "readme.md"
authors = [
    { name = "RVFET", email = "me@rvfet.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pyrage>=1.2.0",
    "pyyaml>=6.0.2",
    "rich>=13.7.1",
    "typer>=0.12.0",
    "wcmatch>=8.5.2",
]

[dependency-groups]
dev = [
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.bandit]
exclude_dirs = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "tests",
]

skips = [
    "B101", # why?: assert is used for internal type narrowing and invariant checks
    "B404", # why?: subprocess is a core dependency required to orchestrate system tools and package managers
    "B603", # why?: we already safely pass argument lists with shell=False; static checks flag all dynamic invocations as false positives
    "B607", # why?: system binaries must resolve portably across operating systems via $PATH rather than brittle hardcoded paths
]

[project.scripts]
noqte = "noqte.cli:app"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv_build]
packages = ["src/noqte"]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]